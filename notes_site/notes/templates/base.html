{% load static %}<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Стикеры{% endblock %} — Пробковая доска</title>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
        crossorigin="anonymous">
  <link rel="stylesheet" href="{% static 'notes/style.css' %}">
</head>
<body class="cork">

<nav class="navbar navbar-expand navbar-dark wood-bar mb-4">
  <div class="container">
    <a class="navbar-brand fw-bold" href="{% url 'index' %}">📌 Пробковая доска</a>
    {% if user.is_authenticated %}
    <ul class="navbar-nav me-auto">
      <li class="nav-item"><a class="nav-link" href="{% url 'index' %}">Доска</a></li>
      <li class="nav-item"><a class="nav-link" href="{% url 'archive' %}">Архив</a></li>
    </ul>
    <span class="navbar-text me-3">{{ user.username }}</span>
    <form method="post" action="{% url 'logout' %}">
      {% csrf_token %}
      <button class="btn btn-sm btn-outline-light">Выйти</button>
    </form>
    {% endif %}
  </div>
</nav>

<main class="container">
  {% for message in messages %}
    <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags }}{% endif %} py-2">{{ message }}</div>
  {% endfor %}

  {% block content %}{% endblock %}
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
<script src="{% static 'notes/script.js' %}"></script>
</body>
</html>
