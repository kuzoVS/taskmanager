{% extends "base.html" %}
{% block title %}Вход{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="sticker sticker-yellow auth-card">
      <span class="pushpin"></span>
      <h2 class="hand mb-3">Вход</h2>
      {% if form.errors %}
        <div class="alert alert-danger py-2">Неверный логин или пароль</div>
      {% endif %}
      <form method="post">
        {% csrf_token %}
        <div class="mb-3">
          <label class="form-label" for="id_username">Логин</label>
          <input class="form-control" id="id_username" name="username" required maxlength="150" autocomplete="username">
        </div>
        <div class="mb-3">
          <label class="form-label" for="id_password">Пароль</label>
          <input class="form-control" id="id_password" name="password" type="password" required autocomplete="current-password">
        </div>
        <button class="btn btn-dark w-100">Войти</button>
      </form>
      <p class="mt-3 mb-0">Нет аккаунта? <a href="{% url 'register' %}">Регистрация</a></p>
    </div>
  </div>
</div>
{% endblock %}
