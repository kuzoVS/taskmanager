{% extends "base.html" %}
{% block title %}Регистрация{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="sticker sticker-green auth-card">
      <span class="pushpin"></span>
      <h2 class="hand mb-3">Регистрация</h2>
      <form method="post">
        {% csrf_token %}
        {% for field in form %}
          <div class="mb-3">
            <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
            {{ field }}
            {% for error in field.errors %}<div class="text-danger small">{{ error }}</div>{% endfor %}
          </div>
        {% endfor %}
        <button class="btn btn-dark w-100">Создать аккаунт</button>
      </form>
      <p class="mt-3 mb-0">Уже есть аккаунт? <a href="{% url 'login' %}">Войти</a></p>
    </div>
  </div>
</div>
{% endblock %}
